[package]
name = "arena-client"
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "wgpu + wasm FPS client: renderer, input, prediction loop, HUD."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
arena-protocol = { path = "../arena-protocol" }
arena-content = { path = "../arena-content" }
arena-anim = { path = "../arena-anim" }
arena-procgen = { path = "../arena-procgen" }
arena-assets = { path = "../arena-assets" }
arena-sim = { path = "../arena-sim" }
arena-net = { path = "../arena-net" }
arena-replica = { path = "../arena-replica" }
glam.workspace = true
serde.workspace = true
serde_json.workspace = true
bincode.workspace = true
bytemuck.workspace = true
wgpu = "29"
winit = "0.29"
tracing.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "Node", "HtmlCanvasElement", "WebSocket", "MessageEvent", "BinaryType", "Blob", "Performance"] }
console_error_panic_hook = "0.1"
tracing-wasm = "0.2"
# Enable the WebGL2 backend so the client also runs on browsers without WebGPU.
# (wgpu prefers BROWSER_WEBGPU on wasm; "webgl" adds the GL fallback path.)
wgpu = { version = "29", features = ["webgl"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "0.3"
env_logger = "0.11"
